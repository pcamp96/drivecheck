[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "drivecheck"
version = "0.1.0"
description = "A Raspberry Pi drive intake station with live testing and notifications"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[project.urls]
Repository = "https://github.com/pcamp96/drivecheck"
Issues = "https://github.com/pcamp96/drivecheck/issues"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1", "playwright>=1.50,<2"]

[project.scripts]
drivecheck = "drivecheck.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["drivecheck"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
